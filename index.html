<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>هناك شيءٌ آخر...</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #18243d 0%, #0b1220 45%, #050914 100%);
      color: #f4f1e8;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 650px;
    }

    .box {
      background: rgba(7, 14, 28, 0.94);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 38px 28px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        inset 0 0 30px rgba(212, 175, 55, 0.025);
    }

    h1 {
      text-align: center;
      color: #d4af37;
      font-size: 30px;
      font-weight: normal;
      margin: 0 0 18px;
    }

    .subtitle {
      text-align: center;
      color: #e9e5dc;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 14px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      background: rgba(255, 255, 255, 0.045);
      color: #ffffff;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    input::placeholder {
      color: #aaa7a0;
    }

    input:focus {
      border-color: rgba(212, 175, 55, 0.75);
    }

    button {
      width: 100%;
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 12px;
      padding: 13px;
      background: rgba(212, 175, 55, 0.08);
      color: #d4af37;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: rgba(212, 175, 55, 0.16);
    }

    .gold {
      color: #d4af37;
    }

    .error {
      text-align: center;
      color: #b9a9a0;
      font-size: 13px;
      margin-top: 16px;
      min-height: 20px;
    }

    #chatPage {
      display: none;
    }

    .chat-header {
      margin-bottom: 20px;
    }

    .chat-header h2 {
      color: #d4af37;
      font-size: 27px;
      font-weight: normal;
      margin: 0 0 8px;
    }

    .status {
      color: #aaa7a0;
      font-size: 12px;
    }

    .messages {
      height: 400px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 15px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      background: rgba(255, 255, 255, 0.025);
      margin-bottom: 15px;
    }

    .message {
      width: fit-content;
      max-width: 80%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 14px;
      line-height: 1.7;
      word-break: break-word;
    }

    .mine {
      margin-left: auto;
      margin-right: 0;
      background: rgba(212, 175, 55, 0.13);
      border: 1px solid rgba(212, 175, 55, 0.22);
      color: #f4f1e8;
    }

    .theirs {
      margin-right: auto;
      margin-left: 0;
      background: rgba(255, 255, 255, 0.07);
      color: #eeeeee;
    }

    .send-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .send-area input {
      margin: 0;
      flex: 1;
    }

    .send-area button {
      width: 85px;
      flex-shrink: 0;
    }

    .logout {
      margin-top: 15px;
      background: transparent;
      border-color: rgba(255, 255, 255, 0.12);
      color: #aaa7a0;
    }

    .small-note {
      text-align: center;
      color: #777872;
      font-size: 11px;
      margin-top: 15px;
    }

    .hint {
      text-align: center;
      color: #777872;
      font-size: 11px;
      margin-top: 4px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- صفحة الدخول -->

  <div class="box" id="loginPage">

    <h1>
      هناك شيءٌ آخر...
    </h1>

    <div class="subtitle">
      بعض الأبواب لا تُفتح إلا بكلمة صغيرة.<br>
      اكتبي الاسم والرمز الذي وصل إليكِ.
    </div>

    <input
      type="text"
      id="username"
      placeholder="الاسم"
      autocomplete="off"
    >

    <input
      type="password"
      id="password"
      placeholder="الرمز"
      autocomplete="off"
    >

    <div class="hint">
      تلميح: مفتاحك هو Hero — والرمز هو ما يليه.
    </div>

    <button id="loginButton" type="button" onclick="login()">
      <span class="gold">دخول</span>
    </button>

    <div class="error" id="loginError">
      يبدو أن هناك شيئًا غير صحيح...
    </div>

  </div>


  <!-- صفحة المحادثة -->

  <div class="box" id="chatPage">

    <div class="chat-header">

      <h2>الصفحة الأخيرة</h2>

      <div class="status" id="status">
        جارٍ الاتصال...
      </div>

    </div>


    <div class="messages" id="messages"></div>


    <div class="send-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتبي شيئًا..."
        autocomplete="off"
      >

      <button id="sendButton" type="button" onclick="sendMessage()">
        إرسال
      </button>

    </div>


    <button class="logout" type="button" onclick="logout()">
      الخروج
    </button>


    <div class="small-note">
      هذه المحادثة خاصة بين الطرفين.
    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://noeakvrotdsanqzrkutj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_vY2JWVsg-4lvQTQO_OXrEw_WCOWMB_c";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     الحسابات
  ========================= */

  const USERS = {
    someone: "1994",
    hero: "2026"
  };


  /* =========================
     الغرفة
  ========================= */

  const ROOM_ID =
    "story2026";


  let currentUser = null;
  let currentUsername = null;
  let realtimeChannel = null;


  /* =========================
     تسجيل الدخول
  ========================= */

  async function login() {

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    const errorBox =
      document.getElementById("loginError");


    if (
      !USERS[username] ||
      USERS[username] !== password
    ) {

      errorBox.textContent =
        "يبدو أن هناك شيئًا غير صحيح...";

      return;
    }


    errorBox.textContent = "";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInAnonymously();


      if (error) {
        throw error;
      }


      currentUser = data.user;
      currentUsername = username;


      document.getElementById("loginPage").style.display =
        "none";

      document.getElementById("chatPage").style.display =
        "block";


      document.getElementById("status").textContent =
        "متصل";


      await loadMessages();

      startRealtime();


    } catch (err) {

      console.error(err);

      errorBox.textContent =
        "حدث خطأ: " + err.message;
    }
  }


  /* =========================
     تحميل الرسائل
  ========================= */

  async function loadMessages() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select("*")
        .eq("room_id", ROOM_ID)
        .order("created_at", {
          ascending: true
        });


    if (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "حدث خطأ في تحميل الرسائل";

      return;
    }


    const box =
      document.getElementById("messages");


    box.innerHTML = "";


    data.forEach(message => {

      const div =
        document.createElement("div");


      div.classList.add("message");


      if (
        currentUser &&
        String(message.sender) ===
        String(currentUser.id)
      ) {

        div.classList.add("mine");

      } else {

        div.classList.add("theirs");
      }


      div.textContent =
        message.content;


      box.appendChild(div);

    });


    box.scrollTop =
      box.scrollHeight;
  }


  /* =========================
     إرسال الرسائل
  ========================= */

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const content =
      input.value.trim();


    if (!content) {
      return;
    }


    if (!currentUser) {

      alert("لم يتم تسجيل الدخول.");

      return;
    }


    button.disabled = true;
    button.textContent = "...";


    try {

      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .insert({
            room_id: ROOM_ID,
            sender: String(currentUser.id),
            content: content
          });


      if (error) {
        throw error;
      }


      input.value = "";
      input.focus();


      document.getElementById("status").textContent =
        "متصل";


      await loadMessages();


    } catch (err) {

      console.error(
        "SEND MESSAGE ERROR:",
        err
      );

      alert(
        "تعذر إرسال الرسالة:\n\n" +
        err.message
      );

      document.getElementById("status").textContent =
        "تعذر إرسال الرسالة";

    } finally {

      button.disabled = false;
      button.textContent = "إرسال";

    }
  }


  /* =========================
     التحديث المباشر
  ========================= */

  function startRealtime() {

    if (realtimeChannel) {

      supabaseClient.removeChannel(
        realtimeChannel
      );
    }


    realtimeChannel =
      supabaseClient
        .channel("mystery-chat-room")

        .on(
          "postgres_changes",

          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
              "room_id=eq." + ROOM_ID
          },

          function() {

            loadMessages();

          }
        )

        .subscribe();
  }


  /* =========================
     زر Enter للإرسال
  ========================= */

  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();
        }
      }
    );


  /* =========================
     الخروج
  ========================= */

  async function logout() {

    if (realtimeChannel) {

      await supabaseClient.removeChannel(
        realtimeChannel
      );

      realtimeChannel = null;
    }


    await supabaseClient.auth.signOut();


    currentUser = null;
    currentUsername = null;


    document.getElementById("chatPage").style.display =
      "none";

    document.getElementById("loginPage").style.display =
      "block";


    document.getElementById("messages").innerHTML =
      "";

    document.getElementById("messageInput").value =
      "";

    document.getElementById("password").value =
      "";

    document.getElementById("status").textContent =
      "جارٍ الاتصال...";
  }

</script>

</body>
</html>
