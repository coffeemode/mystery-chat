<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الحكاية</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #17213a 0%, #090d18 55%, #05070d 100%);
      color: #f5f1e8;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: rgba(13, 19, 34, 0.94);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 22px;
      padding: 30px 22px;
      box-shadow: 0 0 35px rgba(0,0,0,0.45);
    }

    .gold {
      color: #d8b45a;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(212,175,55,.3);
      background: #080c16;
      color: white;
      font-size: 16px;
      outline: none;
      text-align: right;
    }

    input:focus {
      border-color: #d8b45a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8b45a;
      border-radius: 12px;
      background: transparent;
      color: #d8b45a;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: rgba(216,180,90,.1);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .error {
      color: #d98989;
      text-align: center;
      margin-top: 15px;
      display: none;
      line-height: 1.7;
      font-family: Arial, sans-serif;
      font-size: 13px;
      white-space: pre-line;
    }

    #chatPage {
      display: none;
    }

    .chat-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .chat-header h2 {
      font-weight: normal;
      margin: 0 0 5px;
      color: #d8b45a;
    }

    .status {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #777;
    }

    .messages {
      height: 420px;
      overflow-y: auto;
      padding: 10px 4px;
      margin-bottom: 15px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 78%;
      padding: 11px 14px;
      margin: 8px 0;
      border-radius: 15px;
      line-height: 1.6;
      word-wrap: break-word;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .mine {
      margin-right: auto;
      margin-left: 0;
      background: #b99a4b;
      color: #101010;
      border-bottom-right-radius: 4px;
    }

    .other {
      margin-left: auto;
      margin-right: 0;
      background: #1c263d;
      color: #eee;
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-left-radius: 4px;
    }

    .time {
      display: block;
      font-size: 9px;
      opacity: .55;
      margin-top: 3px;
    }

    .send-area {
      display: flex;
      gap: 8px;
    }

    .send-area input {
      margin: 0;
      flex: 1;
    }

    .send-area button {
      width: 75px;
      flex-shrink: 0;
    }

    .logout {
      margin-top: 15px;
      border-color: rgba(255,255,255,.12);
      color: #777;
      font-size: 12px;
      padding: 9px;
    }

    .small-note {
      text-align: center;
      color: #666;
      font-family: Arial, sans-serif;
      font-size: 11px;
      margin-top: 15px;
    }

    /* أيقونة بيانات الدخول */
    .credentials-button {
      width: 42px;
      height: 42px;
      padding: 0;
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(216,180,90,.55);
      color: #d8b45a;
      font-size: 18px;
      font-family: Arial, sans-serif;
    }

    .credentials-box {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid rgba(216,180,90,.25);
      border-radius: 14px;
      background: rgba(8,12,22,.8);
      text-align: center;
      font-family: Arial, sans-serif;
      line-height: 1.9;
      font-size: 13px;
    }

    .credentials-box strong {
      color: #d8b45a;
      font-weight: normal;
    }

    .credentials-title {
      color: #aaa;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- صفحة الدخول -->
  <div class="card" id="loginPage">

    <h1>
      هناك شيءٌ آخر...
    </h1>

    <div class="subtitle">
      بعض الأبواب لا تُفتح إلا بكلمة صغيرة.<br>
      اكتبي الاسم والرمز الذي وصل إليكِ.
    </div>

    <input
      type="text"
      id="username"
      placeholder="الاسم"
      autocomplete="off"
    >

    <input
      type="password"
      id="password"
      placeholder="الرمز"
      autocomplete="off"
    >

    <button id="loginButton" onclick="login()">
      <span class="gold">دخول</span>
    </button>

    <div class="error" id="loginError">
      يبدو أن هناك شيئًا غير صحيح...
    </div>

    <!-- أيقونة بيانات الشخص الثاني -->
    <button
      class="credentials-button"
      onclick="toggleCredentials()"
      title="بيانات الدخول"
    >
      🔑
    </button>

    <div class="credentials-box" id="credentialsBox">

      <div class="credentials-title">
        بيانات الدخول
      </div>

      <div>
        اسم المستخدم:
        <strong>hero</strong>
      </div>

      <div>
        الرقم السري:
        <strong>2026</strong>
      </div>

    </div>

  </div>


  <!-- صفحة الدردشة -->
  <div class="card" id="chatPage">

    <div class="chat-header">

      <h2>الصفحة الأخيرة</h2>

      <div class="status" id="status">
        جارٍ الاتصال...
      </div>

    </div>

    <div class="messages" id="messages"></div>

    <div class="send-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتبي شيئًا..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">
        إرسال
      </button>

    </div>

    <button class="logout" onclick="logout()">
      الخروج
    </button>

    <div class="small-note">
      هذه المحادثة خاصة بين الطرفين.
    </div>

  </div>

</div>


<script>

  /* =====================================================
     إعدادات Supabase
     ===================================================== */

  const SUPABASE_URL =
    "https://noeakvrotdsanqzrkutj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_vY2JWVsg-4lvQTQO_OXrEw_WCOWMB_c";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     بيانات الدخول
     ===================================================== */

  const USERS = {

    someone: "1994",

    hero: "2026"

  };


  /* =====================================================
     الغرفة
     ===================================================== */

  const ROOM_ID = "mystery-room-7f92k4";


  let currentUser = null;


  /* =====================================================
     إظهار / إخفاء بيانات الشخص الثاني
     ===================================================== */

  function toggleCredentials() {

    const box =
      document.getElementById("credentialsBox");

    if (box.style.display === "block") {

      box.style.display = "none";

    }

    else {

      box.style.display = "block";

    }

  }


  /* =====================================================
     تسجيل الدخول
     ===================================================== */

  async function login() {

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value.trim();

    const error =
      document.getElementById("loginError");

    const loginButton =
      document.getElementById("loginButton");


    /* فحص الاسم والرمز */

    if (
      !USERS[username] ||
      USERS[username] !== password
    ) {

      error.innerText =
        "يبدو أن هناك شيئًا غير صحيح...";

      error.style.display = "block";

      return;
    }


    error.style.display = "none";

    loginButton.disabled = true;

    loginButton.innerText = "جارٍ الدخول...";


    try {

      /* تسجيل الدخول المجهول */

      const result =
        await supabaseClient.auth.signInAnonymously();


      const data = result.data;

      const authError = result.error;


      /* إذا حصل خطأ */

      if (authError) {

        console.error(
          "Supabase Error:",
          authError
        );

        error.innerText =
          "خطأ Supabase:\n" +
          authError.message;

        error.style.display = "block";

        loginButton.disabled = false;

        loginButton.innerText = "دخول";

        return;
      }


      /* التأكد من وجود المستخدم */

      if (!data || !data.user) {

        error.innerText =
          "لم يتم إنشاء جلسة الدخول.";

        error.style.display = "block";

        loginButton.disabled = false;

        loginButton.innerText = "دخول";

        return;
      }


      currentUser = data.user;


      /* الانتقال إلى الشات */

      document.getElementById("loginPage").style.display =
        "none";

      document.getElementById("chatPage").style.display =
        "block";


      document.getElementById("status").innerText =
        "متصل";


      await loadMessages();

      listenForMessages();

    }

    catch (err) {

      console.error(
        "Unexpected Error:",
        err
      );

      error.innerText =
        "حدث خطأ:\n" +
        err.message;

      error.style.display = "block";

      loginButton.disabled = false;

      loginButton.innerText = "دخول";

    }

  }


  /* =====================================================
     تحميل الرسائل
     ===================================================== */

  async function loadMessages() {

    const { data, error } =
      await supabaseClient
        .from("messages")
        .select("*")
        .eq("room_id", ROOM_ID)
        .order("created_at", {
          ascending: true
        });


    if (error) {

      console.error(
        "Load Messages Error:",
        error
      );

      document.getElementById("status").innerText =
        "تعذر تحميل الرسائل";

      return;
    }


    const messages =
      document.getElementById("messages");

    messages.innerHTML = "";


    data.forEach(message => {

      displayMessage(message);

    });


    scrollToBottom();

  }


  /* =====================================================
     الرسائل الجديدة
     ===================================================== */

  function listenForMessages() {

    supabaseClient
      .channel("mystery-chat-room")

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter: "room_id=eq." + ROOM_ID
        },

        payload => {

          displayMessage(payload.new);

          scrollToBottom();

        }

      )

      .subscribe(status => {

        console.log(
          "Realtime Status:",
          status
        );


        if (status === "SUBSCRIBED") {

          document.getElementById("status").innerText =
            "متصل الآن";

        }

        else if (status === "CHANNEL_ERROR") {

          document.getElementById("status").innerText =
            "مشكلة في الاتصال";

        }

      });

  }


  /* =====================================================
     عرض الرسالة
     ===================================================== */

  function displayMessage(message) {

    const container =
      document.getElementById("messages");


    if (
      document.querySelector(
        `[data-message-id="${message.id}"]`
      )
    ) {

      return;

    }


    const div =
      document.createElement("div");


    div.classList.add("message");


    if (
      currentUser &&
      message.sender === currentUser.id
    ) {

      div.classList.add("mine");

    }

    else {

      div.classList.add("other");

    }


    div.setAttribute(
      "data-message-id",
      message.id
    );


    const text =
      document.createElement("div");

    text.innerText =
      message.content;


    const time =
      document.createElement("span");

    time.className = "time";


    const date =
      new Date(message.created_at);


    time.innerText =
      date.toLocaleTimeString(
        "ar-SA",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


    div.appendChild(text);

    div.appendChild(time);

    container.appendChild(div);

  }


  /* =====================================================
     إرسال رسالة
     ===================================================== */

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const content =
      input.value.trim();


    if (!content || !currentUser) {

      return;

    }


    input.disabled = true;


    const { error } =
      await supabaseClient
        .from("messages")
        .insert({

          room_id: ROOM_ID,

          sender: currentUser.id,

          content: content

        });


    input.disabled = false;


    if (error) {

      console.error(
        "Send Message Error:",
        error
      );

      alert(
        "لم يتم إرسال الرسالة:\n" +
        error.message
      );

      return;

    }


    input.value = "";

    input.focus();

  }


  /* =====================================================
     Enter للإرسال
     ===================================================== */

  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


  /* =====================================================
     النزول لآخر رسالة
     ===================================================== */

  function scrollToBottom() {

    const messages =
      document.getElementById("messages");


    setTimeout(() => {

      messages.scrollTop =
        messages.scrollHeight;

    }, 50);

  }


  /* =====================================================
     الخروج
     ===================================================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;


    document.getElementById("chatPage").style.display =
      "none";

    document.getElementById("loginPage").style.display =
      "block";


    document.getElementById("messages").innerHTML =
      "";


    document.getElementById("username").value =
      "";

    document.getElementById("password").value =
      "";


    const loginButton =
      document.getElementById("loginButton");

    loginButton.disabled = false;

    loginButton.innerText = "دخول";

  }

</script>

</body>
</html>
