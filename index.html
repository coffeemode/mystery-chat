<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الحكاية</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #17233d 0%, #080d18 55%, #050811 100%);
      color: #f4f0e8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .box {
      background: rgba(10, 17, 31, 0.94);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: #111a2c;
      color: white;
      outline: none;
      font-size: 16px;
      text-align: right;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #d4af37;
      color: #08101d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .key-button {
      width: 45px;
      height: 45px;
      padding: 0;
      margin: 15px auto 0;
      display: block;
      border-radius: 50%;
      font-size: 18px;
    }

    .credentials {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 14px;
      background: rgba(212, 175, 55, 0.06);
      color: #eee;
      line-height: 1.9;
      text-align: center;
    }

    .credentials strong {
      color: #d4af37;
    }

    #loginError {
      color: #e6a4a4;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    #chatPage {
      display: none;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .chat-title {
      color: #d4af37;
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      width: auto;
      padding: 8px 14px;
      margin: 0;
      font-size: 13px;
      background: transparent;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .message {
      margin-bottom: 12px;
      padding: 11px 14px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .my-message {
      margin-right: auto;
      margin-left: 0;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .other-message {
      margin-left: auto;
      margin-right: 0;
      background: rgba(255, 255, 255, 0.08);
    }

    .sender-name {
      font-size: 11px;
      color: #d4af37;
      margin-bottom: 3px;
    }

    .message-time {
      font-size: 10px;
      color: #888;
      margin-top: 5px;
    }

    .send-area {
      display: flex;
      gap: 8px;
    }

    .send-area input {
      margin: 0;
      flex: 1;
    }

    .send-button {
      width: 85px;
      margin: 0;
    }

    #status {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="box" id="loginPage">

    <h1>حكاية صغيرة...</h1>

    <input
      type="text"
      id="username"
      placeholder="اسم المستخدم"
      autocomplete="off"
    >

    <input
      type="password"
      id="password"
      placeholder="الرقم السري"
      autocomplete="off"
    >

    <button onclick="login()">دخول</button>

    <div id="loginError"></div>

    <button class="key-button" onclick="toggleCredentials()">🔑</button>

    <div class="credentials" id="credentials">
      <div>
        اسم المستخدم:
        <strong>hero</strong>
      </div>

      <div>
        الرقم السري:
        <strong>2026</strong>
      </div>
    </div>

  </div>


  <!-- CHAT -->
  <div class="box" id="chatPage">

    <div class="chat-header">

      <div class="chat-title">
        الحكاية
      </div>

      <button class="logout" onclick="logout()">
        خروج
      </button>

    </div>

    <div id="messages"></div>

    <div class="send-area">

      <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك..."
        autocomplete="off"
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button
        class="send-button"
        onclick="sendMessage()"
        id="sendButton"
      >
        إرسال
      </button>

    </div>

    <div id="status">
      متصل
    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://noeakvrotdsanqzrkutj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_vY2JWVsg-4lvQTQO_OXrEw_WCOWMB_c";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     USERS
  ========================= */

  const USERS = {
    someone: "1994",
    hero: "2026"
  };


  /* =========================
     ROOM
  ========================= */

  const ROOM_ID = "mystery-room-7f92k4";


  let currentUser = null;
  let currentUsername = null;
  let realtimeChannel = null;


  /* =========================
     SHOW / HIDE CREDENTIALS
  ========================= */

  function toggleCredentials() {

    const box =
      document.getElementById("credentials");

    if (box.style.display === "block") {
      box.style.display = "none";
    } else {
      box.style.display = "block";
    }
  }


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    const errorBox =
      document.getElementById("loginError");

    errorBox.textContent = "";


    if (!username || !password) {

      errorBox.textContent =
        "اكتب اسم المستخدم والرقم السري.";

      return;
    }


    if (!USERS[username] || USERS[username] !== password) {

      errorBox.textContent =
        "اسم المستخدم أو الرقم السري غير صحيح.";

      return;
    }


    try {

      const {
        data,
        error
      } = await supabaseClient.auth.signInAnonymously();


      if (error) {
        throw error;
      }


      currentUser = data.user;
      currentUsername = username;


      document.getElementById("loginPage").style.display =
        "none";

      document.getElementById("chatPage").style.display =
        "block";


      await loadMessages();

      startRealtime();

    } catch (error) {

      console.error(error);

      errorBox.textContent =
        "حدث خطأ في تسجيل الدخول: " +
        error.message;
    }
  }


  /* =========================
     LOAD MESSAGES
  ========================= */

  async function loadMessages() {

    const {
      data,
      error
    } = await supabaseClient
      .from("messages")
      .select("*")
      .eq("room_id", ROOM_ID)
      .order("created_at", {
        ascending: true
      });


    if (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "تعذر تحميل الرسائل.";

      return;
    }


    displayMessages(data || []);
  }


  /* =========================
     DISPLAY MESSAGES
  ========================= */

  function displayMessages(messages) {

    const box =
      document.getElementById("messages");

    box.innerHTML = "";


    messages.forEach(message => {

      const div =
        document.createElement("div");

      const sender =
        String(message.sender || "");

      const mySender =
        currentUser &&
        sender === String(currentUser.id);


      div.className =
        "message " +
        (mySender
          ? "my-message"
          : "other-message");


      const name =
        document.createElement("div");

      name.className =
        "sender-name";

      name.textContent =
        mySender
          ? currentUsername
          : "الطرف الآخر";


      const content =
        document.createElement("div");

      content.textContent =
        message.content || "";


      const time =
        document.createElement("div");

      time.className =
        "message-time";


      if (message.created_at) {

        const date =
          new Date(message.created_at);

        time.textContent =
          date.toLocaleTimeString(
            "ar-SA",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );
      }


      div.appendChild(name);
      div.appendChild(content);
      div.appendChild(time);

      box.appendChild(div);

    });


    box.scrollTop =
      box.scrollHeight;
  }


  /* =========================
     SEND MESSAGE
  ========================= */

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const content =
      input.value.trim();


    if (!content) {
      return;
    }


    if (!currentUser) {

      alert("لم يتم تسجيل الدخول.");

      return;
    }


    button.disabled = true;
    input.disabled = true;


    const {
      error
    } = await supabaseClient
      .from("messages")
      .insert({
        room_id: ROOM_ID,

        /*
          sender في قاعدة البيانات عندك TEXT
          لذلك نحول UUID إلى TEXT
        */
        sender: currentUser.id.toString(),

        content: content
      });


    button.disabled = false;
    input.disabled = false;


    if (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء إرسال الرسالة:\n\n" +
        error.message
      );

      return;
    }


    input.value = "";

    input.focus();


    await loadMessages();
  }


  /* =========================
     REALTIME
  ========================= */

  function startRealtime() {

    if (realtimeChannel) {
      supabaseClient.removeChannel(
        realtimeChannel
      );
    }


    realtimeChannel =
      supabaseClient
        .channel("mystery-chat-room")

        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
              "room_id=eq." + ROOM_ID
          },
          function(payload) {

            loadMessages();

          }
        )

        .subscribe();
  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    if (realtimeChannel) {

      await supabaseClient.removeChannel(
        realtimeChannel
      );

      realtimeChannel = null;
    }


    await supabaseClient.auth.signOut();


    currentUser = null;
    currentUsername = null;


    document.getElementById("chatPage").style.display =
      "none";

    document.getElementById("loginPage").style.display =
      "block";


    document.getElementById("messages").innerHTML =
      "";

    document.getElementById("messageInput").value =
      "";

    document.getElementById("password").value =
      "";

  }

</script>

</body>
</html>
